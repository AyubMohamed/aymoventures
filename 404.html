<!doctype html>

<head>
<meta charset="utf-8">

<meta property="og:title" content="AYMO Ventures Inc.">
<meta property="og:description" content="A Canadian software company building consumer products.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://aymoventures.ca/">

<style>
  :root {
    --ink: #0d0c0b;
    --paper: #e8e3db;
    --muted: #8d867c;
    --rule: #262320;
    --accent: #c9a227;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--paper);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    padding: 2rem 1.5rem;
    position: relative;
    overflow-x: hidden;
  }

  /* a single soft light source, top-left of the mark */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(60rem 40rem at 50% 22%, rgba(201, 162, 39, 0.08), transparent 70%);
    pointer-events: none;
  }

  main {
    position: relative;
    width: 100%;
    max-width: 34rem;
    text-align: center;
    animation: rise 900ms cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(0.75rem); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    main { animation: none; }
  }

  .mark {
    font-size: clamp(2.25rem, 11vw, 3.75rem);
    font-weight: 600;
    letter-spacing: 0.16em;
    margin: 0;
    /* letter-spacing pads the right edge; pull it back so the mark reads centred */
    text-indent: 0.16em;
    line-height: 1.05;
  }

  .sub {
    margin: 0.9rem 0 0;
    font-size: clamp(0.68rem, 2.6vw, 0.78rem);
    font-weight: 500;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    color: var(--accent);
    text-transform: uppercase;
  }

  hr {
    border: 0;
    border-top: 1px solid var(--rule);
    margin: 2.75rem auto;
    width: 4rem;
  }

  .line {
    margin: 0 auto;
    max-width: 26rem;
    font-size: clamp(1rem, 3.6vw, 1.125rem);
    line-height: 1.65;
    color: var(--paper);
  }

  .line .soon {
    display: block;
    margin-top: 0.35rem;
    color: var(--muted);
  }

  .contact {
    margin-top: 2.75rem;
    font-size: 0.9375rem;
  }

  .contact a {
    color: var(--paper);
    text-decoration: none;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 2px;
    transition: border-color 200ms ease, color 200ms ease;
  }

  .contact a:hover,
  .contact a:focus-visible {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  footer {
    margin-top: 4.5rem;
    font-size: 0.75rem;
    line-height: 1.9;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  footer span { white-space: nowrap; }

  /* the middle dot collapses on narrow screens so the two halves stack cleanly */
  footer .dot { padding: 0 0.5rem; }

  @media (max-width: 24rem) {
    footer .dot { display: block; height: 0; overflow: hidden; padding: 0; }
  }
</style>
</head>
<body>
  <main>
    <h1 class="mark">AYMO</h1>
    <p class="sub">Ventures</p>

    <hr>

    <p class="line">
      That page does not exist.
      <span class="soon">Nothing lost — there is not much here yet.</span>
    </p>

    <p class="contact">
      <a href="/">Back to the front page</a>
    </p>

    <footer>
      <span>AYMO Ventures Inc.</span><span class="dot">·</span><span>Toronto, Canada</span>
      <br>
      <span>&copy; 2026 AYMO Ventures Inc.</span>
    </footer>
  </main>
</body>
</html>
